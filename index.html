/* Brand fonts (FARO guideline): TT Norms Pro Serif + URW DIN / URW DIN SemiCond — subset Latin + Tiếng Việt */
/* Layout: Cream Foam sidebar + off-white workspace (FARO Visual Brand Guideline v1.0). Palette: Cream Foam 40 / Morning Sky 20 / Young Leaf, Golden Pulp, Roasted Bean, Wood Bark 10 each. Serif (TT Norms Pro Serif → Bitter) for headlines, DIN-like sans for body. */
:root{
  --cream:#F8F0D2;      /* Cream Foam */
  --sky:#A5D8F0;        /* Morning Sky */
  --leaf:#B4D78C;       /* Young Leaf */
  --gold:#F7D464;       /* Golden Pulp */
  --bean:#2E2926;       /* Roasted Bean */
  --bark:#83572E;       /* Wood Bark */
  --roast:var(--bean); --honey:var(--gold); --crimson:var(--bark); --forest:var(--leaf); --parch:var(--cream);

  --bg:#F7F5F0; --surface:#FFFEFB; --sunk:#F2EEE3; --ink:#2E2926; --ink2:#5A514A; --muted:#8A8076; --line:#E8E2D4; --line2:#D8D0BE;
  --side:#F8F0D2; --side-ink:#2E2926; --side-mut:#8C7F66; --side-line:#EADFB8;
  --late:#83572E; --late-bg:#F3E5D6; --warn:#6E5512; --warn-bg:#FCEFC2; --ok:#4E6B30; --ok-bg:#E7F1DA;
  --doing:#2F6280; --doing-bg:#E4F2FA;
  --honey-ink:#6E5512; --focus:#4C9CC4; --on-dark:#F8F0D2;
  --f-head:"FARO Serif","TT Norms Pro Serif","Bitter",Georgia,"Times New Roman",serif;
  --f-body:"FARO DIN","URW DIN","Barlow","Segoe UI",system-ui,sans-serif;
  --f-label:"FARO DIN SemiCond","FARO DIN","URW DIN SemiCond","Barlow Semi Condensed","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1F1B19;--surface:#2A2522;--sunk:#342E2A;--ink:#F8F0D2;--ink2:#DCD3BE;--muted:#A89C8A;--line:#3B3430;--line2:#4C4440;
  --side:#2E2926;--side-ink:#F8F0D2;--side-mut:#A89C8A;--side-line:#3D3632;
  --late:#E0B48A;--late-bg:#43301F;--warn:#F7D464;--warn-bg:#3D3418;--ok:#C6E2A4;--ok-bg:#2C3A20;--doing:#A5D8F0;--doing-bg:#22343E;--honey-ink:#F7D464;--focus:#A5D8F0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F1B19;--surface:#2A2522;--sunk:#342E2A;--ink:#F8F0D2;--ink2:#DCD3BE;--muted:#A89C8A;--line:#3B3430;--line2:#4C4440;
  --side:#2E2926;--side-ink:#F8F0D2;--side-mut:#A89C8A;--side-line:#3D3632;
  --late:#E0B48A;--late-bg:#43301F;--warn:#F7D464;--warn-bg:#3D3418;--ok:#C6E2A4;--ok-bg:#2C3A20;--doing:#A5D8F0;--doing-bg:#22343E;--honey-ink:#F7D464;--focus:#A5D8F0;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.only-app{display:none}
.partners{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr))}
.partner{display:grid;gap:14px;align-content:start}
.p-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.p-logo{width:46px;height:46px;border-radius:12px;background:var(--cream);color:#2E2926;display:grid;place-items:center;font-family:var(--f-label);font-weight:600;font-size:15px;letter-spacing:.04em;border:1px solid var(--line)}
.p-title h2{font-size:21px;margin:2px 0 3px}
.p-note{margin:0;font-size:14px;color:var(--ink2);background:var(--sunk);border-radius:10px;padding:10px 12px}
.p-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;font-size:14px}
.p-meta .eyebrow{display:block;margin-bottom:2px}.p-meta b{font-weight:500;color:var(--ink)}.p-meta .num{white-space:nowrap}
.pcards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.pcard h3{font-family:var(--f-head);font-weight:300;font-size:19px;margin:0;line-height:1.25}.pcard h3 .x{color:var(--muted);padding:0 4px}
.pcard .p-goal{margin:0;font-size:13.5px;color:var(--ink2)}
.pcard .pc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.p-items{display:grid}
.p-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.p-item.is-done .mi-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.p-pic{display:flex;align-items:center;gap:8px;font-size:13.5px;white-space:nowrap}
.p-pic .av{width:26px;height:26px;font-size:10px}
button.p-st{border:0;cursor:pointer;font:inherit;font-family:var(--f-label);font-size:12px;font-weight:500;letter-spacing:.07em}
button.p-st:hover{filter:brightness(.95);box-shadow:inset 0 0 0 1px currentColor}
.p-res{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:13px}
.p-res p{flex-basis:100%;margin:0;color:var(--ink2);white-space:pre-line}
.p-res a{color:var(--sky);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.p-res .hint{flex-basis:100%;font-size:12px}
.p-thumb{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--line) center/cover no-repeat;cursor:zoom-in;padding:0}
.ph-grid{display:flex;gap:10px;flex-wrap:wrap}
.ph{position:relative;width:76px;height:76px;border-radius:10px;border:1px solid var(--line);background:center/cover no-repeat}
.ph button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:var(--card,#fff);color:var(--ink);cursor:pointer;font-size:12px;line-height:1;padding:0}
.lightbox img{display:block;width:100%;max-height:75vh;object-fit:contain;border-radius:12px;background:var(--line)}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.p-foot .prog{flex:1;min-width:180px}
.pi-list{display:grid;gap:8px}
.pi-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 120px auto;gap:6px;align-items:center}
@media (max-width:600px){.pi-row{grid-template-columns:1fr 1fr auto}.pi-row input[name=item_name]{grid-column:1/-1}.p-item{grid-template-columns:minmax(0,1fr) auto}.p-item .p-pic{grid-row:2;grid-column:1}.p-item .badge{grid-row:1/3;grid-column:2;align-self:center}.p-head{grid-template-columns:auto minmax(0,1fr)}.p-head>.badge{grid-column:1/-1;justify-self:start}}
.na-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn)}
@media (max-width:980px){.only-desk{display:none!important}.only-app{display:block}
 .mlist{display:grid}.mitem{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:10px;min-width:0}
 .mi-top{display:flex;gap:10px;align-items:flex-start}.mi-main{flex:1;min-width:0}.mi-title{font-weight:500}
 .mi-nums{display:flex;gap:28px}.mi-nums .eyebrow{display:block;font-size:10.5px;margin-bottom:1px}.mi-nums b{font-weight:500;font-variant-numeric:tabular-nums}
 .mi-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.mi-foot .row{flex-wrap:wrap;gap:6px}
 .mi-acts{padding-left:38px;gap:6px;flex-wrap:wrap}
 .chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--ok-bg);color:var(--ok);font-size:12.5px;font-weight:500;padding:2px 8px;border-radius:6px}
 .req{grid-template-columns:1fr!important}
 .mitem .badge .dsk{display:none}
 .card-h>.row:first-child{flex-wrap:nowrap;align-items:center}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:26px 18px 20px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:block;width:150px;height:auto;color:inherit}
.brand .logo{width:132px}
.brand span{display:block;font-family:var(--f-label);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;margin-top:12px;color:var(--side-mut);border-top:1px solid var(--side-line);padding-top:10px}
.nav{display:grid;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:8px;font-family:var(--f-label);font-weight:500;font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mut)}
.nav button:hover{color:var(--side-ink);background:color-mix(in srgb,var(--side-ink) 7%,transparent)}
.nav button[aria-current="page"]{color:#2E2926;background:var(--sky)}
.nav button:focus-visible{outline:2px solid var(--focus)}
.ico{width:18px;height:18px;flex:none}
.nav button{gap:10px}
.nav button .lbl{flex:1;white-space:nowrap}
.nav .cnt::after{content:' ' attr(data-suf)}
.sidetop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.topacts{display:flex;gap:6px;align-items:center}
.iconbtn{all:unset;cursor:pointer;position:relative;width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;color:var(--side-ink)}
.iconbtn:hover{background:color-mix(in srgb,var(--side-ink) 8%,transparent)}
.iconbtn:focus-visible{outline:2px solid var(--focus)}
.iconbtn .ico{width:22px;height:22px}
.mav{display:none!important}
.mav .av{width:32px;height:32px}

/* app mode (phones & tablets): top app bar + bottom tab bar */
@media (max-width:980px){

  .mav{display:inline-grid!important}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -6px 18px -14px #2E292680}
  .nav button .lbl{flex:none;white-space:nowrap}

  .nav button .ico{width:23px;height:23px}

  .nav .cnt{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
  .nav .cnt::after{content:none!important}
  .main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .stickyhead{top:var(--appbar,56px)}
  .totop{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
  .overlay{place-items:end stretch!important;padding:0!important;align-content:end}
  .modal{border-radius:20px 20px 0 0!important;max-height:92%;max-width:none!important;width:100%;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}
  .modal::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line2);justify-self:center;margin:-10px 0 -4px}
}


/* page header */
.phead{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--f-label);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-head);font-weight:300;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(30px,3.6vw,40px);line-height:1.1;margin-top:4px}
h2{font-size:23px;line-height:1.2}
h3{font-size:18px;line-height:1.3;font-weight:400}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* scope bar */
.scope{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.scope button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 12px 11px;font-size:14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.scope button:hover{color:var(--ink)}

.scope button:focus-visible{outline:2px solid var(--focus)}
.swipe-hint{display:none}
@media (max-width:1024px) and (pointer:coarse){.swipe-hint{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px auto 0;width:max-content;max-width:100%;padding:6px 8px 6px 14px;border-radius:999px;background:var(--sunk);color:var(--ink2);font-size:13px;animation:hintNudge 2.4s ease-in-out infinite}
 .swipe-hint button{all:unset;cursor:pointer;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}}
@keyframes hintNudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#main.swipe-next{animation:swNext .26s ease-out}#main.swipe-prev{animation:swPrev .26s ease-out}#main.swipe-edge{animation:swEdge .3s ease-out}
@keyframes swNext{from{transform:translateX(36px);opacity:.35}to{transform:none;opacity:1}}
@keyframes swPrev{from{transform:translateX(-36px);opacity:.35}to{transform:none;opacity:1}}
@keyframes swEdge{0%,100%{transform:none}40%{transform:translateX(var(--edge,10px))}}
@media (prefers-reduced-motion:reduce){#main.swipe-next,#main.swipe-prev,#main.swipe-edge,.swipe-hint{animation:none!important}}
.cdot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;display:inline-block}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--bean);color:#F8F0D2;border-color:var(--bean)}
.btn.honey{background:var(--gold);color:#2E2926;border-color:var(--gold)}
.btn.ok{background:var(--leaf);color:#2E2926;border-color:var(--leaf)}
.btn.danger{color:var(--late);border-color:var(--late);background:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line2)}
.btn.sm{padding:5px 10px;font-size:13px;min-height:32px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--cream);color:#2E2926;border-color:var(--cream)}}
:root[data-theme="dark"] .btn.primary{background:var(--cream);color:#2E2926;border-color:var(--cream)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}

.kpi .v small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:400;margin-left:5px}
.kpi .s{font-size:13px;color:var(--muted);margin-top:6px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:420px){.kpi{padding:14px 14px}.kpi .v{font-size:28px}.kpi .v small{font-size:12.5px;margin-left:3px}.kpi .s{font-size:12px}}

.meter{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex;margin-top:5px;margin-bottom:-7px;box-sizing:content-box;border-block:7px solid transparent;background-clip:padding-box;cursor:help}
.meter i{transition:opacity .15s}
.meter.tipon i{opacity:.4}
.meter.tipon i.hot{opacity:1}
.meter.tipon i.hot[style*=transparent]{background:var(--line2)!important}
#mtip{position:fixed;z-index:300;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.3;font-weight:500;padding:6px 10px;border-radius:8px;white-space:nowrap;box-shadow:0 8px 20px -10px #0007;transform:translate(-50%,calc(-100% + 2px));opacity:0;transition:opacity .12s;display:flex;align-items:center;gap:7px}
#mtip.on{opacity:1}
#mtip b{width:9px;height:9px;border-radius:3px;flex:none;box-shadow:0 0 0 1px #fff4}
.meter i{display:block;height:100%}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:12px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:5px;white-space:nowrap;line-height:1.5}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-late{background:var(--late-bg);color:var(--late)}
/* Deadline alerts: honey pulse when close, red SOS blink when late */
:root{--sos:#D23B2B;--sos-ink:#FFF6F2}
.fx-warn{animation:fxWarn 1.6s ease-in-out infinite}
.fx-warn::before{animation:fxDot 1.6s ease-in-out infinite}
@keyframes fxWarn{0%,100%{box-shadow:0 0 0 0 rgba(247,212,100,0)}50%{box-shadow:0 0 0 4px rgba(247,212,100,.55)}}
@keyframes fxDot{0%,100%{opacity:1}50%{opacity:.25}}

@keyframes fxSos{0%{background:var(--sos);color:var(--sos-ink)}50%{background:var(--late-bg);color:var(--sos)}}

.fx-txt-warn{color:var(--warn);font-weight:500;animation:fxDot 1.6s ease-in-out infinite}
.fx-txt-sos{color:var(--sos);font-weight:600;animation:fxDot 1s steps(1,end) infinite}
.meter i[data-tip^="Sắp đến hạn"]{animation:fxDot 1.6s ease-in-out infinite}
.meter i[data-tip^="Trễ hạn"]{background:var(--sos)!important;animation:fxDot 1s steps(1,end) infinite}
.sev.late{background:var(--sos)!important;animation:fxDot 1s steps(1,end) infinite}.sev.warn{animation:fxDot 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sev,.fx-warn,.fx-warn::before,.fx-sos,.fx-txt-warn,.fx-txt-sos,.meter i[data-tip]{animation:none!important}}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-doing{background:var(--doing-bg);color:var(--doing)}
.b-done{background:var(--ok-bg);color:var(--ok)}
.b-sub{background:transparent;color:var(--honey-ink);box-shadow:inset 0 0 0 1px var(--honey-ink)}
.b-plain::before{display:none}

/* hero (campaign) */
.hero{background:var(--hc,var(--sky));color:var(--hi,#2E2926);border-radius:14px;padding:30px 30px 26px;position:relative;overflow:hidden;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.14}

.hero h1{font-size:clamp(30px,4.4vw,46px);max-width:20ch;margin:8px 0 10px}
.hero p{margin:0;max-width:62ch;opacity:.9}
.hero .hmeta{display:flex;flex-wrap:wrap;gap:18px 32px;margin-top:22px;padding-top:16px;border-top:1px solid color-mix(in srgb,currentColor 25%,transparent)}
.hero .hmeta div{display:grid;gap:2px}
.hero .hmeta .eyebrow{font-size:11px}
.hero .hmeta b{font-weight:500}

/* brief */
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));column-gap:28px;border-top:1px solid var(--line)}
.brief div{padding:14px 0;border-bottom:1px solid var(--line);min-width:0}

/* timeline */
.tl{position:relative;min-width:640px;padding-top:4px}
.tl-head{display:grid;grid-template-columns:210px minmax(0,1fr);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.tl-name{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;font-weight:500;padding-right:12px;min-width:0}

.tl-name:focus-visible{outline:2px solid var(--focus)}

.tl-bar{position:absolute;top:13px;height:22px;border-radius:5px;background:var(--c);display:flex;align-items:center;padding:0 9px;font-size:12px;color:var(--ci,#2E2926);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}

.scrollx{overflow-x:auto}

.camp{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* tasks */
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}

@media (max-width:760px){.seg{display:flex;gap:8px;border:0;border-radius:0;overflow:visible;background:none}.seg button{border:1px solid var(--line2);border-radius:99px;background:var(--surface);padding:7px 13px;font-size:13.5px}.seg button:first-child{border-left:1px solid var(--line2)}.seg button[aria-pressed="true"]{border-color:var(--bean)}.filters{gap:12px}}
.select{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px}
.group-h{display:flex;align-items:center;gap:10px;padding:4px 2px 10px;flex-wrap:wrap}

.trow:hover{background:var(--sunk)}

.ttitle{font-weight:500;overflow-wrap:anywhere}
.tsub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.tstate{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tdetail{padding:4px 18px 18px 21px;display:grid;gap:22px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);background:var(--sunk)}

.notemark{display:inline-flex;align-items:center;gap:4px;color:var(--honey-ink)}

.field{display:grid;gap:5px;min-width:0}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{font-size:13px;color:var(--muted)}
.log{font-size:12.5px;color:var(--muted);display:grid;gap:3px}
.rec-by{font-size:12px;margin-top:2px}

const DEFAULT_PEOPLE=['Nguyên','Phương','Thọ','Huy','Hải','Ngân','Trâm Anh','Khánh Tâm','Nam Pé'];
let PEOPLE=[...DEFAULT_PEOPLE],ALLPEOPLE=[...DEFAULT_PEOPLE];
const PERMS=[
  ['assign','Giao việc, sửa/xoá việc, mở lại việc đã hoàn thành; thêm/sửa/xoá chương trình Partnership'],
  ['receive','Được giao việc (có tên trong danh sách PIC)'],
  ['campaign','Tạo campaign, sửa campaign mình làm Lead'],
  ['budget_propose','Đề xuất ngân sách, cập nhật số đã chi'],
  ['budget_approve','Duyệt ngân sách, phân bổ ngân sách campaign'],
  ['reconcile','Đối soát khoản chi (kế toán)'],
  ['report','Ghi nhận bài đăng, nhập số liệu báo cáo'],
  ['close_month','Chốt tháng, mở lại tháng đã chốt'],
  ['accounts','Quản lý tài khoản và vai trò']];
const BASE_ROLES=[
  {id:'bod',name:'BOD',perms:PERMS.map(p=>p[0]),builtin:true,order:0,desc:'Toàn quyền'},
  {id:'staff',name:'Nhân sự marketing',perms:['receive','campaign','budget_propose','report'],builtin:true,order:1},
  {id:'acc',name:'Kế toán',perms:['reconcile'],builtin:true,order:9}];
function allRoles(){const m=new Map(BASE_ROLES.map(r=>[r.id,{...r}]));(D.roles||[]).forEach(r=>{if(r.id==='bod')return;m.set(r.id,{...(m.get(r.id)||{}),...r,builtin:!!(m.get(r.id)?.builtin)})});return [...m.values()].sort((a,b)=>(a.order??5)-(b.order??5)||a.name.localeCompare(b.name))}
function roleOf(id){return allRoles().find(r=>r.id===id)||{id,name:id,perms:[]}}
function roleName(id){return roleOf(id).name}
function hasPerm(roleId,p){return roleOf(roleId).perms.includes(p)}
function can(p){return !!ME&&hasPerm(ME.role,p)}
const DEFAULT_PLATFORMS=['TikTok','Facebook','Instagram','Creator','Báo chí','In-store'];
function platforms(){const l=(D.platforms||[]).filter(x=>x.name).sort((a,b)=>(a.order??0)-(b.order??0)).map(x=>x.name);return l.length?l:[...DEFAULT_PLATFORMS]}
const canPlatforms=()=>can('close_month')||can('accounts');
const CATS=['Content','Video','Social','PR / Booking','Ads','Production','In-store','Event','Khác'];
const COLORS={sky:['#A5D8F0','#2E2926','Morning Sky'],leaf:['#B4D78C','#2E2926','Young Leaf'],gold:['#F7D464','#2E2926','Golden Pulp'],cream:['#F8F0D2','#2E2926','Cream Foam'],bark:['#83572E','#F8F0D2','Wood Bark'],roasted:['#2E2926','#F8F0D2','Roasted Bean']};
const OLD_COLORS={forest:'leaf',honey:'gold',crimson:'bark',bean:'bark',roast:'roasted'};
const COLL=['platforms','roles','accounts','campaigns','months','tasks','budget','posts','archive','partners'];

/* ---------- state ---------- */
let db=null,MODE='demo';
const STANDALONE=!(window.claude&&typeof window.claude.use==='function');
function notAvail(feature){const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="Tính năng chưa có"><div class="modal" style="max-width:440px"><div class="na-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg></div><h2>Tính năng này hiện chưa có</h2><p style="margin:0;color:var(--ink2)">${feature?`<b>${esc(feature)}</b> chưa dùng được trên bản tải về máy. `:''}Vui lòng liên hệ lập trình viên để được hỗ trợ.</p><p class="hint" style="margin:0">Bản tải về chỉ để xem thử với dữ liệu mẫu, thay đổi không được lưu.</p><div class="row" style="justify-content:flex-end"><button type="button" class="btn primary" data-close>Đã hiểu</button></div></div></div>`;
  root.querySelector('[data-close]').onclick=()=>root.innerHTML='';root.querySelector('.overlay').addEventListener('mousedown',e=>{if(e.target.classList.contains('overlay'))root.innerHTML=''})}
let D=emptyData(),liveD=emptyData();
const UI={tab:'plan',camp:'all',open:new Set(),fStatus:'open',fPic:'all',closeArm:false};
const today=new Date();today.setHours(0,0,0,0);
const todayS=iso(today),thisMonth=todayS.slice(0,7);
let cur=thisMonth,me='',ME=null,liveReady=false;
const AUTH={view:'login',msg:'',kind:'',found:''};
try{UI.tab=localStorage.getItem('faro_tab')||'plan'}catch(e){}

function emptyData(){return{platforms:[],roles:[],accounts:[],campaigns:[],months:{},tasks:[],budget:[],posts:[],archive:{},partners:[]}}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function role(){return ME?.role||'staff'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nf(n,d=0){return (+n||0).toLocaleString('vi-VN',{maximumFractionDigits:d})}
function pct(a,b){return b?Math.round(a/b*100):0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function daysLeft(s){if(!s)return 99;return Math.round((new Date(s+'T00:00:00')-today)/864e5)}
function fdate(s){if(!s)return '—';const p=s.split('-');return p[2]+'/'+p[1]}
function monthLabel(m){const [y,mm]=m.split('-');return 'Tháng '+(+mm)+' / '+y}
function monthBounds(m){const [y,mm]=m.split('-').map(Number);const e=new Date(y,mm,0);return{s:m+'-01',e:iso(e),days:e.getDate()}}
function nowStr(){const d=new Date();return d.toLocaleDateString('vi-VN')+' '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
function avatarOf(n){const a=D.accounts.find(x=>x.name===n&&x.avatar);return a?a.avatar:''}
function av(n,cls='',title=''){const u=avatarOf(n);return u?`<span class="av has-img ${cls}" title="${esc(title||n)}" style="background-image:url('${u}')" role="img" aria-label="${esc(n)}"></span>`:`<span class="av ${cls}" title="${esc(title||n)}">${initials(n)}</span>`}
function initials(n){if(n==='BOD')return 'BOD';const p=n.split(' ');return (p.length>1?p[0][0]+p[p.length-1][0]:n.slice(0,2)).toUpperCase()}
function clone(o){return JSON.parse(JSON.stringify(o))}
function locked(m=cur){return !!D.months[m]?.closed}
function inkFor(hex){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);const r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const L=x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);return .2126*L(r)+.7152*L(g)+.0722*L(b)>.38?'#2E2926':'#F8F0D2'}
function colOf(k){return /^#[0-9a-f]{3,6}$/i.test(k||'')?[k,inkFor(k),'Tuỳ chọn']:COLORS[k]||COLORS[OLD_COLORS[k]]||COLORS.sky}
function col(c){return colOf(c?.color)}

/* ---------- campaign scoping ---------- */
const campById=id=>D.campaigns.find(c=>c.id===id);
function campActive(c,m=cur){const b=monthBounds(m);return (c.start||'0')<=b.e&&(c.end||'9999')>=b.s}
function monthCamps(m=cur){return D.campaigns.filter(c=>campActive(c,m)).sort((a,b)=>(a.start||'').localeCompare(b.start||''))}
function campState(c){if(todayS<(c.start||''))return 'Sắp chạy';if(todayS>(c.end||'9999'))return 'Đã kết thúc';return 'Đang chạy'}
function inScope(x){return UI.camp==='all'?monthCamps().some(c=>c.id===x.campaignId):x.campaignId===UI.camp}
function campPeople(c){if(!c)return [];return [...new Set([c.lead,...(c.team||[]),...D.tasks.filter(t=>t.campaignId===c.id&&t.pic).map(t=>t.pic)].filter(Boolean))]}
function canPropose(c){return !!c&&(can('budget_approve')||(can('budget_propose')&&campPeople(c).includes(me)))}
function scopeCamps(){return UI.camp==='all'?monthCamps():monthCamps().filter(c=>c.id===UI.camp)}
function monthTasks(){const b=monthBounds(cur);return D.tasks.filter(t=>{const inM=(t.deadline||'').slice(0,7)===cur;const carried=t.status!=='done'&&(t.deadline||'')<b.s&&cur===thisMonth;return (inM||carried)&&inScope(t)})}
function campBudget(cid){return D.budget.filter(b=>b.campaignId===cid)}
function monthPosts(m=cur){return D.posts.filter(p=>(p.date||'').slice(0,7)===m)}
function spendsInMonth(lines,m=cur){return lines.reduce((a,b)=>a+(b.spends||[]).filter(s=>(s.date||'').slice(0,7)===m).reduce((x,s)=>x+(+s.amt||0),0),0)}

async function put(coll,id,obj){
  if(MODE==='live'){try{await db.collection(coll).doc(id).set(obj)}catch(e){toast(e.code==='invalid_argument'?'Bạn đang có quyền xem, chưa lưu được thay đổi.':'Chưa lưu được ('+(e.code||'lỗi')+'). Thử lại sau giây lát.')}}
  else{upsertLocal(coll,id,obj);render()}
}
async function remove(coll,id){
  if(MODE==='live'){try{await db.collection(coll).doc(id).delete()}catch(e){toast('Chưa xoá được ('+(e.code||'lỗi')+').')}}
  else{if(Array.isArray(D[coll]))D[coll]=D[coll].filter(r=>r.id!==id);else delete D[coll][id];render()}
}
function upsertLocal(coll,id,obj){if(Array.isArray(D[coll])){const i=D[coll].findIndex(r=>r.id===id);const o={...obj,id};i<0?D[coll].push(o):D[coll][i]=o}else D[coll][id]=obj}

function randStr(n,chars='abcdefghjkmnpqrstuvwxyz23456789'){const r=crypto.getRandomValues(new Uint32Array(n));return [...r].map(x=>chars[x%chars.length]).join('')}

    </form>`;
  el.innerHTML=brand+`<div class="auth-panel">${f}</div>`;
  drawAuthBg();

}
function drawAuthBg(){const cv=document.querySelector('canvas[data-authbg]');if(!cv)return;const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(devicePixelRatio||1,2);cv.width=r.width*dpr;cv.height=r.height*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const W=r.width,H=r.height;let seed=17;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  /* checker tiles like the guideline illustration set */
  const T=Math.max(56,Math.round(W/8));
  for(let y=0;y<H+T;y+=T)for(let x=0;x<W+T;x+=T){g.fillStyle=((x/T+y/T)%2)?'#FDF5E4':'#FFFDF1';g.fillRect(x,y,T,T)}
  g.strokeStyle='#AE955E';g.globalAlpha=.35;g.setLineDash([4,5]);g.lineWidth=1;
  for(let x=T;x<W;x+=T){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=T;y<H;y+=T){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.setLineDash([]);g.globalAlpha=1;
  const leaf=(x,y,s,a,c,vein)=>{g.save();g.translate(x,y);g.rotate(a);g.fillStyle=c;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(s*.25,-s*.36,s*.75,-s*.34,s,0);g.bezierCurveTo(s*.75,s*.34,s*.25,s*.36,0,0);g.fill();
    if(vein){g.strokeStyle='rgba(255,253,241,.85)';g.lineWidth=Math.max(1.2,s*.02);g.beginPath();g.moveTo(s*.05,0);g.lineTo(s*.9,0);g.stroke();for(let i=1;i<5;i++){const t=i/5;g.beginPath();g.moveTo(s*t,0);g.lineTo(s*(t+.12),-s*.16);g.moveTo(s*t,0);g.lineTo(s*(t+.12),s*.16);g.stroke()}}g.restore()};
  const branch=(x,y,len,a,c)=>{g.save();g.translate(x,y);g.rotate(a);g.strokeStyle=c;g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(len*.5,-len*.08,len,0);g.stroke();
    for(let i=1;i<7;i++){const t=i/7*len;leaf(t,0,len*.26,-.9,c,0);leaf(t,0,len*.26,.9,c,0)}g.restore()};
  const cherries=(x,y,s)=>{for(let i=0;i<5;i++){const a=i/5*Math.PI*2;const cx=x+Math.cos(a)*s*.55,cy=y+Math.sin(a)*s*.55;g.fillStyle='#EAE9A3';g.beginPath();g.arc(cx,cy,s*.45,0,7);g.fill();g.fillStyle='rgba(255,253,241,.9)';g.beginPath();g.arc(cx-s*.12,cy-s*.12,s*.09,0,7);g.fill()}};
  const star=(x,y,s,c)=>{g.fillStyle=c;for(let i=0;i<6;i++){g.save();g.translate(x,y);g.rotate(i*Math.PI/3);g.beginPath();g.ellipse(0,-s*.5,s*.16,s*.5,0,0,7);g.fill();g.restore()}};
  leaf(W*.62,H*.02,W*.5,.75,'#BFC586',1);leaf(-W*.06,H*.5,W*.46,-.45,'#BFC586',1);leaf(W*.5,H*.98,W*.52,-.9,'#BFC586',1);
  branch(W*.02,H*.12,W*.42,.35,'#FFD48F');branch(W*.98,H*.42,W*.4,2.6,'#FFD48F');branch(W*.2,H*.78,W*.36,-.35,'#FFD48F');
  cherries(W*.8,H*.14,W*.045);cherries(W*.88,H*.7,W*.05);cherries(W*.12,H*.36,W*.04);
  star(W*.55,H*.3,W*.07,'#FFD48F');star(W*.33,H*.6,W*.05,'#BFC586');
  for(let i=0;i<40;i++){g.fillStyle='rgba(174,149,94,.28)';g.beginPath();g.arc(rnd()*W,rnd()*H,1+rnd()*1.6,0,7);g.fill()}
  /* soft panel behind the wordmark so it stays legible */
  const m=document.querySelector('.auth-brand .mark');if(m){const mr=m.getBoundingClientRect(),pr=cv.getBoundingClientRect();g.fillStyle='rgba(248,240,210,.92)';const px=mr.left-pr.left-28,py=mr.top-pr.top-24;const pw=mr.width+56,ph=mr.height+48;g.beginPath();g.roundRect?g.roundRect(px,py,pw,ph,18):g.rect(px,py,pw,ph);g.fill()}
}

document.addEventListener('submit',e=>{const f=e.target.closest('form[data-auth]');if(!f)return;e.preventDefault();authSubmit(f)});
document.addEventListener('click',e=>{const btn=e.target.closest('form[data-auth] button.primary,form[data-auth] button[type=submit]');if(!btn)return;const f=btn.closest('form[data-auth]');e.preventDefault();if(f.reportValidity&&!f.reportValidity())return;authSubmit(f)});
let authBusy=false;
async function authSubmit(f){if(authBusy)return;authBusy=true;try{await authRun(f)}catch(err){AUTH.msg='Có lỗi khi đăng nhập ('+(err&&err.message||err)+'). Thử tải lại trang.';AUTH.kind='err';render()}finally{authBusy=false}}
async function authRun(f){
  const v=Object.fromEntries(new FormData(f)),kind=f.dataset.auth,fail=m=>{AUTH.msg=m;AUTH.kind='err';document.activeElement?.blur();render()};
  if(!window.crypto?.subtle&&kind!=='forgotuser'&&kind!=='forgot'&&MODE==='live')return fail('Trình duyệt này chưa hỗ trợ mã hoá mật khẩu. Mở trang bằng Chrome, Safari hoặc Edge bản mới.');
  if(kind==='login'){
    const a=findUser(v.username);
    if(!a||a.active===false||!(await checkPw(a,v.pw)))return fail(a&&a.active===false?'Tài khoản này đã bị khoá. Liên hệ BOD.':'Sai tên đăng nhập hoặc mật khẩu.');
    AUTH.msg='';setMe(a);const o={...a,lastLogin:nowStr()};document.activeElement?.blur();put('accounts',a.id,o);ME=o;render();
  }else if(kind==='setup'){
    if(D.accounts.length)return fail('Đã có tài khoản BOD. Hãy đăng nhập.');
    const u=slugUser(v.username);if(!u)return fail('Tên đăng nhập chỉ gồm chữ không dấu, số và dấu chấm.');
    if(v.pw!==v.pw2)return fail('Hai mật khẩu chưa khớp.');
    const a=await setPw({id:'a-'+uid(),name:v.name.trim(),username:u,role:'bod',title:'Ban giám đốc',phone:'',email:'',active:true,mustChange:false,sessVer:0,createdAt:nowStr(),createdBy:'Thiết lập lần đầu',lastLogin:nowStr()},v.pw);
    AUTH.msg='';setMe(a);document.activeElement?.blur();await put('accounts',a.id,a);ME=a;render();
  }else if(kind==='change'){
    if((v.pw||'').length<6)return fail('Mật khẩu cần ít nhất 6 ký tự.');
    if(v.pw!==v.pw2)return fail('Hai mật khẩu chưa khớp.');
    if(await checkPw(ME,v.pw))return fail('Mật khẩu mới phải khác mật khẩu tạm.');
    const a=await setPw({...ME,mustChange:false},v.pw);AUTH.msg='';document.activeElement?.blur();ME=a;saveSess(a);await put('accounts',a.id,a);render();toast('Đã đổi mật khẩu.');
  }else if(STANDALONE&&(kind==='forgot'||kind==='forgotuser')){
    notAvail(kind==='forgot'?'Gửi yêu cầu cấp lại mật khẩu':'Tìm lại tên đăng nhập');
  }else if(kind==='forgot'){
    const a=findUser(v.username);
    if(a&&a.active!==false){await put('accounts',a.id,{...a,resetRequested:{at:nowStr(),note:(v.note||'').trim()}})}
    AUTH.view='login';AUTH.msg='Đã gửi yêu cầu. BOD sẽ cấp mật khẩu tạm cho bạn qua Zalo hoặc trực tiếp. Nếu tên đăng nhập sai, BOD sẽ không nhận được yêu cầu.';AUTH.kind='ok';document.activeElement?.blur();render();
  }else if(kind==='forgotuser'){
    const q=String(v.contact||'').replace(/\s/g,'').toLowerCase();
    const a=D.accounts.find(x=>x.active!==false&&q&&((x.phone||'').replace(/\s/g,'')===q||(x.email||'').toLowerCase()===q));
    AUTH.found=a?a.username:'';AUTH.msg=a?'':'Không tìm thấy tài khoản khớp. Liên hệ BOD để được hỗ trợ.';AUTH.kind='err';document.activeElement?.blur();render();
  }
}

   ${rolesSection()}
   <section class="card"><div class="card-h"><h2>Danh sách tài khoản</h2><span class="hint">${accs.filter(a=>a.active!==false).length} đang hoạt động · ${accs.filter(a=>a.active===false).length} đã khoá</span></div>

     <td>${status(a)}${a.active===false&&a.deactivatedAt?`<div class="hint">từ ${esc(a.deactivatedAt)}</div>`:''}</td><td class="hint">${esc(a.lastLogin||'Chưa đăng nhập')}</td>
     <td><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">${accActs(a)}</div></td></tr>`).join('')}
    </tbody></table></div>

async function toAvatar(file){
  if(!file||!/^image\//.test(file.type))throw new Error('Chọn file ảnh (JPG, PNG, WEBP, HEIC đã chuyển sang JPG…).');
  if(file.size>15*1024*1024)throw new Error('Ảnh quá lớn, chọn ảnh dưới 15 MB.');
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Không đọc được ảnh này, thử ảnh khác.'));i.src=url});
    const S=240,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');const m=Math.min(img.naturalWidth,img.naturalHeight);
    g.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,S,S);
    return c.toDataURL('image/jpeg',.82);}finally{URL.revokeObjectURL(url)}
}

const NIC={task:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/>',done:'<path d="m5 12 4 4 10-10"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',money:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3"/>',key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2"/>',undo:'<path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12"/>'};
function parseVN(str){const m=String(str||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\D+(\d{1,2}):(\d{2}))?/);if(!m)return 0;return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||8),+(m[5]||0)).getTime()}

function notifs(){
  if(!ME)return [];const out=[],now=Date.now(),old=now-30*864e5,push=o=>{if(o.ts>old||o.act)out.push(o)};
  const ct=id=>campById(id)?.name||'';
  D.tasks.forEach(t=>{
    if(t.pic===me){
      if(t.status==='assigned')push({key:'as-'+t.id+'-'+(t.assignedAt||''),ts:parseVN(t.assignedAt),ic:'task',act:1,text:`Bạn được giao việc: ${t.title}`,sub:`${ct(t.campaignId)} · hạn ${fdate(t.deadline)} · bấm để nhận việc`,go:{tab:'exec',task:t.id}});
      if(t.status==='doing'&&(t.returnNote||'').startsWith('Mở lại'))push({key:'ro-'+t.id+'-'+t.returnNote,ts:parseVN(t.returnNote),ic:'undo',act:1,text:`Việc được mở lại: ${t.title}`,sub:t.returnNote,go:{tab:'exec',task:t.id}});
      if(t.status!=='done'){const d=daysLeft(t.deadline);if(d<0)push({key:'od-'+t.id,ts:isoMs(t.deadline)+864e5,ic:'clock',act:1,text:`Quá hạn ${-d} ngày: ${t.title}`,sub:`${ct(t.campaignId)} · hạn ${fdate(t.deadline)}`,go:{tab:'exec',task:t.id}});
        else if(d<=1)push({key:'du-'+t.id,ts:isoMs(t.deadline)-864e5,ic:'clock',act:1,text:`${d===0?'Hạn hôm nay':'Hạn ngày mai'}: ${t.title}`,sub:ct(t.campaignId),go:{tab:'exec',task:t.id}})}
    }
    if(can('assign')&&t.pic!==me){
      if(t.status==='done'&&t.acceptedAt)push({key:'dn-'+t.id+'-'+t.acceptedAt,ts:parseVN(t.acceptedAt),ic:'done',text:`${t.acceptedBy||t.pic} đã hoàn thành: ${t.title}`,sub:ct(t.campaignId)+(t.acceptedDate>t.deadline?' · trễ hạn':' · đúng hạn'),go:{tab:'exec',task:t.id}});
      if(t.receivedAt&&t.status!=='assigned')push({key:'rc-'+t.id+'-'+t.receivedAt,ts:parseVN(t.receivedAt),ic:'task',text:`${t.pic} đã nhận việc: ${t.title}`,sub:ct(t.campaignId),go:{tab:'exec',task:t.id}});
    }
  });
  D.budget.forEach(b=>{
    if(can('budget_approve')&&b.status==='pending')push({key:'bp-'+b.id,ts:parseVN(b.createdAt),ic:'money',act:1,text:`${b.pic} đề xuất ngân sách: ${b.item}`,sub:`${nf(b.amount,1)} triệu · ${ct(b.campaignId)} · chờ duyệt`,go:{tab:'budget'}});
    if(b.pic===me&&b.status==='approved'&&b.approvedAt&&b.approvedBy!==me)push({key:'ba-'+b.id+'-'+b.approvedAt,ts:parseVN(b.approvedAt),ic:'money',text:`Ngân sách đã duyệt: ${b.item}`,sub:`${nf(b.amount,1)} triệu · ${ct(b.campaignId)}`,go:{tab:'budget'}});
    if(b.pic===me&&b.status==='rejected')push({key:'br-'+b.id+'-'+(b.rejectedAt||''),ts:parseVN(b.rejectedAt),ic:'money',text:`Ngân sách bị từ chối: ${b.item}`,sub:ct(b.campaignId),go:{tab:'budget'}});
    if(can('reconcile')&&!b.reconciled&&b.reopen&&b.reopen.by!==me)push({key:'ru-'+b.id+'-'+b.reopen.at,ts:parseVN(b.reopen.at),ic:'undo',act:1,text:`${b.reopen.by} bỏ đối soát: ${b.item}`,sub:`Lý do: ${b.reopen.reason} · cần xem lại`,go:{tab:'budget'}});
    else if(can('reconcile')&&b.spent>0&&!b.reconciled){const last=(b.spends||[]).slice(-1)[0];push({key:'rq-'+b.id+'-'+(b.spends||[]).length,ts:isoMs(last?.date,12),ic:'money',act:1,text:`Khoản chi cần đối soát: ${b.item}`,sub:`Đã chi ${nf(b.spent,1)} triệu · ${b.pic}`,go:{tab:'budget'}})}
  });
  if(can('accounts'))D.accounts.forEach(a=>{if(a.resetRequested&&a.active!==false)push({key:'pw-'+a.id+'-'+a.resetRequested.at,ts:parseVN(a.resetRequested.at),ic:'key',act:1,text:`${a.name} xin cấp lại mật khẩu`,sub:a.resetRequested.note||'',go:{tab:'accounts'}})});
  XN.forEach(n=>out.push(n));
  return out.sort((a,b)=>b.ts-a.ts).slice(0,40);
}

/* Swipe left/right on the content to move between campaign scopes (mobile & tablet: Tổng quan, Triển khai, Ngân sách) */
(function(){
  const TABS=['plan','exec','budget'],EDGE=24,MIN=60;let st=null;
  const scrollsX=el=>{for(let n=el;n&&n!==document.body;n=n.parentElement){if(n.matches&&n.matches('input,textarea,select,.modal,.overlay,[data-noswipe]'))return true;const cs=getComputedStyle(n);if(/(auto|scroll)/.test(cs.overflowX)&&n.scrollWidth>n.clientWidth+2)return true}return false};
  document.addEventListener('touchstart',e=>{st=null;if(e.touches.length!==1||window.innerWidth>1024||!TABS.includes(UI.tab)||!ME)return;
    const main=document.getElementById('main');if(!main||!main.contains(e.target)||!main.querySelector('.scope')||document.querySelector('#modalRoot .overlay'))return;
    const t=e.touches[0];if(t.clientX<EDGE||t.clientX>window.innerWidth-EDGE||scrollsX(e.target))return;st={x:t.clientX,y:t.clientY,t:Date.now()}},{passive:true});
  document.addEventListener('touchend',e=>{if(!st)return;const t=e.changedTouches[0],dx=t.clientX-st.x,dy=t.clientY-st.y,dt=Date.now()-st.t;st=null;
    if(Math.abs(dx)<MIN||Math.abs(dx)<Math.abs(dy)*1.6||dt>900)return;
    const order=['all',...monthCamps().map(c=>c.id)],i=Math.max(0,order.indexOf(UI.camp)),j=i+(dx<0?1:-1);const main=document.getElementById('main');

    UI.camp=order[j];UI.closeArm=false;render();main.classList.remove('swipe-next','swipe-prev','swipe-edge');void main.offsetWidth;main.classList.add(dx<0?'swipe-next':'swipe-prev');
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}},{passive:true});

function drawHero(){
  document.querySelectorAll('canvas[data-hero]').forEach(cv=>{const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(devicePixelRatio||1,2);cv.width=r.width*dpr;cv.height=r.height*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.fillStyle=getComputedStyle(cv.parentElement).color;
    let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
    const flower=(x,y,s)=>{g.beginPath();for(let i=0;i<5;i++){const a=i/5*Math.PI*2;g.moveTo(x+Math.cos(a)*s*.5+s*.45,y+Math.sin(a)*s*.5);g.arc(x+Math.cos(a)*s*.5,y+Math.sin(a)*s*.5,s*.45,0,Math.PI*2)}g.fill()};
    const leaf=(x,y,s,a)=>{g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(s*.45,-s*.32,s,0);g.quadraticCurveTo(s*.45,s*.32,0,0);g.fill();g.restore()};
    const W=r.width,H=r.height;flower(W-80,30,70);flower(W-300,H+10,52);leaf(W-210,90,170,-.55);leaf(W-30,H-40,140,2.5);leaf(W*.62,-10,120,.9);
    for(let i=0;i<10;i++){g.beginPath();g.arc(W*.55+rnd()*W*.45,rnd()*H,3+rnd()*5,0,7);g.fill()}});
}

async function toPhoto(file){
  if(!file||!/^image\//.test(file.type))throw new Error('Chỉ nhận file ảnh (JPG, PNG, WEBP).');
  if(file.size>15*1024*1024)throw new Error('Ảnh quá lớn, chọn ảnh dưới 15 MB.');
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Không đọc được ảnh này, thử ảnh khác.'));i.src=url});
    const M=1024,r=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72);}finally{URL.revokeObjectURL(url)}
}

function agg(m){

  const tasks=D.tasks.filter(t=>(t.deadline||'').slice(0,7)===m);
  const byPlatform={};platforms().forEach(p=>byPlatform[p]={posts:0,views:0,eng:0});
  posts.forEach(p=>{const o=byPlatform[p.platform]||(byPlatform[p.platform]={posts:0,views:0,eng:0});o.posts++;o.views+=+p.views||0;o.eng+=+p.eng||0});
  const byStaff={};ALLPEOPLE.forEach(p=>byStaff[p]={posts:0,views:0,tasks:0,done:0,ontime:0});
  posts.forEach(p=>{if(byStaff[p.pic]){byStaff[p.pic].posts++;byStaff[p.pic].views+=+p.views||0}});
  tasks.forEach(t=>{const s=byStaff[t.pic];if(!s)return;s.tasks++;if(t.status==='done'){s.done++;if(!t.acceptedDate||t.acceptedDate<=t.deadline)s.ontime++}});
  const byCampaign={};cs.forEach(c=>{const ps=posts.filter(p=>p.campaignId===c.id),ts=tasks.filter(t=>t.campaignId===c.id),bl=campBudget(c.id);
    byCampaign[c.id]={name:c.name,lead:c.lead||'',color:c.color||'forest',posts:ps.length,views:ps.reduce((a,p)=>a+(+p.views||0),0),eng:ps.reduce((a,p)=>a+(+p.eng||0),0),tasks:ts.length,done:ts.filter(t=>t.status==='done').length,

}

function openModal(title,fields,onSave,extra=''){

  // Some viewers sandbox the page without form submission, so Save runs from the click itself.
  f.addEventListener('submit',e=>{e.preventDefault();run()});

  f.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!['checkbox','radio','file','button'].includes(e.target.type)){e.preventDefault();run()}});

    async()=>{const rows=[...document.querySelectorAll('#plist .prow')];const names=rows.map(r=>r.querySelector('input').value.trim());
      if(names.some(n=>!n))return 'Tên nền tảng không được để trống.';
      if(new Set(names.map(n=>n.toLowerCase())).size!==names.length)return 'Có hai nền tảng trùng tên.';
      if(!names.length)return 'Cần ít nhất một nền tảng.';
      const keep=new Set(rows.map(r=>r.dataset.pid));
      for(const [i,r] of rows.entries()){const id=r.dataset.pid,name=names[i],orig=r.dataset.orig;await put('platforms',id,{id,name,order:i,updatedBy:me});
        if(orig&&orig!==name){for(const ps of D.posts.filter(x=>x.platform===orig))await put('posts',ps.id,{...clone(ps),platform:name})}}
      for(const x of (D.platforms||[]))if(!keep.has(x.id))await remove('platforms',x.id);
      toast('Đã lưu danh sách nền tảng.')});
  const list=document.getElementById('plist');
  const add=()=>{const i=document.getElementById('pnew'),v=i.value.trim();if(!v)return;const d=document.createElement('div');d.innerHTML=row({id:'p-'+uid(),name:v,order:99});d.firstElementChild.dataset.orig='';list.appendChild(d.firstElementChild);i.value='';i.focus()};
  document.getElementById('padd').onclick=add;
  document.getElementById('pnew').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
  list.addEventListener('click',e=>{const r=e.target.closest('.prow');if(!r)return;
    if(e.target.closest('[data-pdel]')){const b=e.target.closest('[data-pdel]');const n=use(r.dataset.orig);if(n&&!b.dataset.armed){b.dataset.armed=1;b.textContent='Xoá? ('+n+' bài cũ vẫn giữ)';return}r.remove()}
    const m=e.target.closest('[data-pmove]');if(m){const d=+m.dataset.pmove;if(d<0&&r.previousElementSibling)list.insertBefore(r,r.previousElementSibling);if(d>0&&r.nextElementSibling)list.insertBefore(r.nextElementSibling,r)}});
}
async function closeMonth(){

async function saveFile(filename,data){
  const dl=await (window.claude?.use?.('downloads')??Promise.resolve(null)).catch(()=>null);
  if(!dl){toast('Trình xem này chưa cho tải file. Mở trang trên claude.ai để xuất.');return}
  try{await dl.save({filename,data});toast('Đã xuất '+filename)}catch(e){if(e.code!=='declined')toast('Chưa xuất được file ('+e.code+').')}
}

async function exportPdf(){
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')}catch(e){toast('Chưa tải được thư viện PDF.');return}
  toast('Đang dựng PDF…');
  const el=document.getElementById('reportPrint');el.querySelectorAll('.actions').forEach(b=>b.style.visibility='hidden');
  const canvas=await html2canvas(el,{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor});
  el.querySelectorAll('.actions').forEach(b=>b.style.visibility='');
  const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'}),W=190,pageH=277,h=canvas.height*W/canvas.width;
  for(let y=0;y<h;y+=pageH){const sh=Math.min(pageH,h-y),sc=document.createElement('canvas');sc.width=canvas.width;sc.height=Math.round(sh*canvas.width/W);
    sc.getContext('2d').drawImage(canvas,0,Math.round(y*canvas.width/W),canvas.width,sc.height,0,0,canvas.width,sc.height);if(y>0)pdf.addPage();pdf.addImage(sc.toDataURL('image/jpeg',.9),'JPEG',10,10,W,sh)}
  saveFile(`FARO_Coffee_Inspiration_${cur}.pdf`,pdf.output('blob'));
}
